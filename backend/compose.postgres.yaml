services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lblstdio}
      POSTGRES_USER: ${POSTGRES_USER:-lblstdio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting PostgreSQL}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lblstdio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lblstdio} -d ${POSTGRES_DB:-lblstdio}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  lblstdio_postgres_data:
